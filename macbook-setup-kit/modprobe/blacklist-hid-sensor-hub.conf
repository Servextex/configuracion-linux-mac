# MacBookPro13,3: hid_sensor_hub roba la interfaz .0002 del iBridge (05ac:8600) en una carrera
# de arranque y deja la Touch Bar en blanco. En esta maquina no se usa para nada (los sensores
# van por apple_ib_als / macsmc). Bloquearlo hace que apple-ibridge gane .0002 SIEMPRE.
blacklist hid_sensor_hub
install hid_sensor_hub /usr/bin/false
