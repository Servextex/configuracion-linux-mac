# Profile-set para Apple T2 con 1 altavoz (AppleT2x1) — Mac mini 8,1
#
# El paquete apple-t2-audio-config 0.3-2 solo trae apple-t2x2/x4/x6, y la regla udev
# 92-apple-t2-audio.rules compone el nombre leyendo /proc/asound/cards, que aqui dice
# "AppleT2x1". Sin este archivo PipeWire cae a output:mono-fallback y el jack de 3.5mm
# no aparece como salida seleccionable.
#
# NO es una copia de apple-t2x2.conf: aquel mapea un BuiltinMic en device 1 que este
# equipo no tiene (el Mac mini 2018 no lleva microfono interno).
#
# Canales verificados en el hardware:
#   hw:0,0 Speaker       -> 1 canal, S24_LE 48000  (mono)
#   hw:0,2 Codec Output  -> 2 canales, S24_LE 48000 (jack 3.5mm estereo)
#   hw:0,3 Codec Input   -> 1 canal, S32_LE 48000  (mono)

[Mapping Speakers]
device-strings = hw:%f,0
paths-output = t2-speakers
channel-map = mono
direction = output

[Mapping Headphones]
device-strings = hw:%f,2
paths-output = t2-headphones
channel-map = left,right
direction = output

[Mapping HeadsetMic]
device-strings = hw:%f,3
paths-input = t2-headset-mic
channel-map = mono
direction = input

[Profile Default]
description = Default Profile
output-mappings = Speakers Headphones
input-mappings = HeadsetMic
