# Desactiva el control de volumen por hardware (AVRCP absolute volume) en A2DP.
# Los Logi Z607 anuncian soporte AVRCP pero ignoran los comandos SetAbsoluteVolume,
# asi que PipeWire creia que el altavoz manejaba el volumen y no aplicaba volumen
# por software: el slider no hacia nada salvo en 0 (que es un mute, comando aparte).
# Con esto PipeWire aplica el volumen el mismo por software y el control vuelve a
# funcionar en todo su recorrido.
#
# Para revertir: borrar este archivo y reiniciar wireplumber.

monitor.bluez.properties = {
  bluez5.enable-hw-volume = false
}
